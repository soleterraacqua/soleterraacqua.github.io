<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" role="img" aria-labelledby="t">
  <title id="t">Latta da 5 litri dell'olio di Soriano nel Cimino</title>
  <defs>
    <linearGradient id="fronte" x1="0" x2="1">
      <stop offset="0" stop-color="#3b5025"/>
      <stop offset=".18" stop-color="#55703a"/>
      <stop offset=".55" stop-color="#425a29"/>
      <stop offset="1" stop-color="#2c3e1c"/>
    </linearGradient>
    <linearGradient id="fianco" x1="0" x2="1">
      <stop offset="0" stop-color="#26361a"/>
      <stop offset="1" stop-color="#1b2712"/>
    </linearGradient>
    <linearGradient id="coperchio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe5c4"/>
      <stop offset=".5" stop-color="#cdbd8a"/>
      <stop offset="1" stop-color="#a99560"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" x2="1">
      <stop offset="0" stop-color="#a8822f"/>
      <stop offset=".45" stop-color="#e3c46e"/>
      <stop offset="1" stop-color="#9c7a2e"/>
    </linearGradient>
    <linearGradient id="riflesso" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e6"/>
      <stop offset="1" stop-color="#f1e6cc"/>
    </linearGradient>
    <filter id="sfuma" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <!-- ombra a terra -->
  <ellipse cx="158" cy="392" rx="128" ry="13" fill="#1f2d24" opacity=".28" filter="url(#sfuma)"/>

  <!-- fianco destro -->
  <path d="M226 104 L272 78 L272 356 Q272 362 266 365 L232 384 Q226 386 226 380 Z" fill="url(#fianco)"/>
  <path d="M226 104 L272 78 L272 90 L226 116 Z" fill="#9c7a2e"/>
  <path d="M226 372 L272 346 L272 356 Q272 362 266 365 L232 384 Q226 386 226 384 Z" fill="#8a6c28"/>
  <path d="M226 116 L272 90 M226 372 L272 346" stroke="#1b2712" stroke-width="1.5" opacity=".5"/>
  <path d="M238 112 L250 105 L250 360 L238 367 Z" fill="#fff" opacity=".05"/>

  <!-- fronte -->
  <rect x="40" y="104" width="186" height="282" rx="9" fill="url(#fronte)"/>
  <rect x="62" y="108" width="26" height="274" fill="url(#riflesso)"/>
  <!-- bordi aggraffati in alto e in basso -->
  <rect x="40" y="104" width="186" height="12" rx="6" fill="url(#oro)"/>
  <rect x="40" y="372" width="186" height="14" rx="7" fill="url(#oro)"/>
  <path d="M44 116 H222 M44 372 H222" stroke="#1f2d15" stroke-width="1.5" opacity=".5"/>

  <!-- coperchio -->
  <path d="M40 106 L86 79 Q88 78 91 78 L268 78 Q274 78 272 82 L228 105 Q226 106 222 106 Z" fill="url(#coperchio)" stroke="#f6eed4" stroke-width="2" stroke-linejoin="round"/>
  <path d="M58 101 L95 82 H258 L222 101 Z" fill="none" stroke="#a99560" stroke-width="1.5" opacity=".7"/>

  <!-- tappo -->
  <ellipse cx="96" cy="94" rx="17" ry="7" fill="#7d5f22"/>
  <rect x="81" y="74" width="30" height="20" fill="url(#oro)"/>
  <path d="M86 76 V92 M91 76 V92 M96 76 V92 M101 76 V92 M106 76 V92" stroke="#7d5f22" stroke-width="1.4" opacity=".7"/>
  <ellipse cx="96" cy="74" rx="15" ry="6" fill="#efd78f" stroke="#9c7a2e" stroke-width="1.5"/>

  <!-- maniglia -->
  <path d="M146 93 C146 44, 238 40, 238 88" fill="none" stroke="#1b2712" stroke-width="9" stroke-linecap="round"/>
  <path d="M150 86 C152 52, 232 48, 233 84" fill="none" stroke="#55703a" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
  <rect x="139" y="88" width="15" height="9" rx="3" fill="#1b2712"/>
  <rect x="231" y="83" width="15" height="9" rx="3" fill="#1b2712"/>

  <!-- scritta sopra l'etichetta -->
  <text x="133" y="141" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3.2" fill="#e3c46e">MONTI CIMINI</text>

  <!-- etichetta -->
  <rect x="56" y="152" width="154" height="200" rx="10" fill="url(#carta)"/>
  <rect x="62" y="158" width="142" height="188" rx="7" fill="none" stroke="#c9a24a" stroke-width="1.6"/>
  <rect x="66" y="162" width="134" height="180" rx="5" fill="none" stroke="#c9a24a" stroke-width=".7" opacity=".7"/>

  <!-- ramo d'olivo -->
  <g>
    <path d="M86 205 C106 190, 140 184, 182 188" fill="none" stroke="#6d5a33" stroke-width="2.2" stroke-linecap="round"/>
    <g fill="#5d7334">
      <ellipse cx="100" cy="190" rx="11" ry="3.6" transform="rotate(-38 100 190)"/>
      <ellipse cx="104" cy="205" rx="11" ry="3.6" transform="rotate(28 104 205)"/>
      <ellipse cx="122" cy="181" rx="12" ry="3.8" transform="rotate(-30 122 181)"/>
      <ellipse cx="146" cy="178" rx="12" ry="3.8" transform="rotate(-16 146 178)"/>
      <ellipse cx="168" cy="179" rx="11" ry="3.6" transform="rotate(-8 168 179)"/>
      <ellipse cx="160" cy="196" rx="11" ry="3.6" transform="rotate(22 160 196)"/>
      <ellipse cx="185" cy="193" rx="10" ry="3.4" transform="rotate(30 185 193)"/>
    </g>
    <g fill="#8fa35a" opacity=".85">
      <ellipse cx="134" cy="196" rx="10" ry="3.2" transform="rotate(26 134 196)"/>
      <ellipse cx="90" cy="198" rx="9" ry="3" transform="rotate(-62 90 198)"/>
    </g>
    <ellipse cx="128" cy="201" rx="5.4" ry="6.6" fill="#3a2a35" transform="rotate(-18 128 201)"/>
    <ellipse cx="145" cy="203" rx="5.4" ry="6.6" fill="#556b2f" transform="rotate(14 145 203)"/>
    <ellipse cx="172" cy="200" rx="5" ry="6.2" fill="#3a2a35" transform="rotate(8 172 200)"/>
    <circle cx="126.4" cy="198.6" r="1.4" fill="#fff" opacity=".45"/>
    <circle cx="143.6" cy="200.6" r="1.4" fill="#fff" opacity=".45"/>
    <circle cx="170.6" cy="197.8" r="1.3" fill="#fff" opacity=".45"/>
  </g>

  <text x="133" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill="#34451f">Olio</text>
  <text x="133" y="275" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#34451f">DI SORIANO</text>
  <text x="133" y="291" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#34451f">NEL CIMINO</text>
  <path d="M100 303 H166" stroke="#c9a24a" stroke-width="1.2"/>
  <rect x="98" y="312" width="70" height="22" rx="11" fill="#b8664c"/>
  <text x="133" y="327" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#fffaf0">5 LITRI</text>
</svg>
